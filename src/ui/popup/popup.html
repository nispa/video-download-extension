<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header>
      <img src="../../../icons/icon.svg" alt="" width="20" height="20" />
      <h1 data-i18n="extName"></h1>
      <button id="settings" class="secondary icon" data-i18n-title="settings">⚙</button>
    </header>

    <section id="ytdlp" hidden>
      <h2 data-i18n="sectionYtdlp"></h2>
      <div class="card">
        <div id="ytdlp-info" class="meta" data-i18n="ytdlpSites"></div>
        <div id="ytdlp-drm" class="meta error" data-i18n="ytdlpDrmWarning" hidden></div>
        <div id="ytdlp-actions" class="actions">
          <select id="ytdlp-format">
            <option value="best" data-i18n="formatBest"></option>
            <option value="1080p" data-i18n="format1080"></option>
            <option value="720p" data-i18n="format720"></option>
            <option value="audio" data-i18n="formatAudio"></option>
          </select>
          <button id="ytdlp-download" data-i18n="download"></button>
        </div>
      </div>
    </section>

    <section>
      <h2 data-i18n="sectionPage"></h2>
      <ul id="items" class="list"></ul>
      <p id="empty" class="empty" data-i18n="emptyList" hidden></p>
    </section>

    <section id="jobs-section" hidden>
      <h2 data-i18n="sectionJobs"></h2>
      <ul id="jobs" class="list"></ul>
    </section>
  </body>
</html>
